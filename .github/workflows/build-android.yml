name: build-blutter-android-2192
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - dart_version: 2.19.2
            snapshot_hash: f08b3f26b90031c53c19961dd81f0bd3
    steps:
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 gcc-13 cmake ninja-build python3 python3-pip pkg-config libicu-dev libcapstone-dev xxd
          sudo pip3 install pyelftools requests

      - name: 克隆源码 (standalone)
        run: git clone --depth 1 https://github.com/AcE77505/blutter-standalone.git blutter

      - name: 手动准备 Dart 2.19.2 源码 + Flutter flags 补丁
        working-directory: blutter
        run: |
          mkdir -p dartsdk
          git clone --depth 1 -b 2.19.2 --filter=blob:none --sparse https://github.com/dart-lang/sdk.git dartsdk/v2.19.2
          cd dartsdk/v2.19.2
          git sparse-checkout set runtime tools third_party/double-conversion
          python3 - <<'PYEOF'
          import re
          p = "runtime/vm/flag_list.h"
          s = open(p, encoding="utf-8").read()
          # 1) lazy_dispatchers 行(吃掉尾随\和空格) → 追加 kbc_keep + enable_aion
          pat1 = r'(P\(lazy_dispatchers, bool, true, "Generate dispatchers lazily"\))\s*\\?\s*\n'
          rep1 = r'\1 \\\n  P(kbc_keep, bool, false, "Keep Kernel Binary Cache") \\\n  P(enable_aion, bool, true, "Enable Aion") \\\n'
          s2, n1 = re.subn(pat1, rep1, s, count=1)
          if n1:
              s = s2
              print("flag1 kbc_keep+enable_aion OK")
          else:
              print("flag1 pattern missing")
          # 2) dedup_instructions 注释行后 → 追加 llvm_compiler
          pat2 = r'("Canonicalize instructions when precompiling\."\))\s*\\?\s*\n'
          rep2 = r'\1 \\\n  P(llvm_compiler, bool, true, "Use LLVM compiler")\n'
          s2, n2 = re.subn(pat2, rep2, s, count=1)
          if n2:
              s = s2
              print("flag2 llvm_compiler OK")
          else:
              print("flag2 pattern missing")
          open(p, "w", encoding="utf-8").write(s)
          PYEOF
          echo "=== 验证补丁 ==="
          grep -n kbc_keep runtime/vm/flag_list.h
          grep -n llvm_compiler runtime/vm/flag_list.h

      - name: 编译 Dart VM (跳过 checkout, 用已补丁源码)
        working-directory: blutter
        run: |
          python3 dartvm_fetch_build.py ${{ matrix.dart_version }} android arm64 ${{ matrix.snapshot_hash }}

      - name: 生成 frida_template.h
        working-directory: blutter
        run: |
          python3 - <<'PYEOF'
          import json
          js = open('scripts/frida.template.js', encoding='utf-8').read()
          esc = json.dumps(js)
          h = '#pragma once\n#include <string_view>\nstatic const std::string_view kFridaTemplate = ' + esc + ';\n'
          open('blutter/src/frida_template.h', 'w', encoding='utf-8').write(h)
          print('frida_template.h generated:', len(js), 'chars')
          PYEOF

      - name: Dart 2.19 owner 兼容补丁
        working-directory: blutter
        run: |
          python3 - <<'PYEOF'
          import re
          p = 'blutter/src/DartTypes.cpp'
          s = open(p, encoding='utf-8').read()
          pat = r'\(intptr_t\)\s*\w+\.untag\(\)\s*->\s*owner\(\)\s*==\s*0'
          s2, n = re.subn(pat, 'typeParam.IsFunctionTypeParameter()', s)
          if n > 0:
              open(p, 'w', encoding='utf-8').write(s2)
              print('owner patch applied')
          else:
              print('owner pattern not found')
          PYEOF

      - name: 编译 Blutter
        working-directory: blutter/blutter
        run: |
          VER="${{ matrix.dart_version }}"
          LIB="dartvm${VER}_android_arm64"
          MAJOR=$(echo "$VER" | cut -d. -f1)
          MINOR=$(echo "$VER" | cut -d. -f2)
          MACROS=""
          if [ "$MAJOR" -eq 3 ]; then MACROS="-DHAS_RECORD_TYPE=1"; fi
          if [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 4 ]; then MACROS="$MACROS -DNO_METHOD_EXTRACTOR_STUB=1"; fi
          if [ "$MAJOR" -eq 3 ] && [ "$MINOR" -ge 6 ]; then MACROS="$MACROS -DUNIFORM_INTEGER_ACCESS=1"; fi
          cmake -GNinja -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++-13 -DCMAKE_C_COMPILER=gcc-13 \
            -DDARTLIB="$LIB" $MACROS
          ninja -C build

      - name: 打包
        working-directory: blutter
        run: |
          VER="${{ matrix.dart_version }}"
          mkdir -p deploy/blutter_android/lib
          cp blutter/build/blutter_dartvm${VER}_android_arm64 deploy/blutter_android/
          cp /usr/lib/aarch64-linux-gnu/libcapstone.so.* deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libicuuc.so.* deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libicudata.so.* deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libstdc++.so.6 deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libgcc_s.so.1 deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libc.so.6 deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/libm.so.6 deploy/blutter_android/lib/ 2>/dev/null || true
          cp /usr/lib/aarch64-linux-gnu/ld-linux-aarch64.so.1 deploy/blutter_android/lib/ 2>/dev/null || true
          cd deploy && zip -r ../blutter_dartvm${VER}_android_arm64.zip blutter_android/

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: blutter_dartvm_${{ matrix.dart_version }}_android_arm64
          path: blutter/blutter_dartvm${{ matrix.dart_version }}_android_arm64.zip
          retention-days: 90
